/* ============================================================================
   てけいマスター — AIせんせい 修正パッチ（2026-08 時点の Gemini API 仕様に対応）

   【貼り方】
   index.html の <script> 内にある
        // 安定版 Gemini API 呼び出し（1.5-flash / 2.0-flash）
        async function callGeminiAPI(userPrompt, systemPrompt = "") { ... }
   の関数まるごと（コメント行から閉じ括弧まで）を削除し、
   同じ場所にこのファイルの中身を貼り付けてください。

   ※ STORAGE_KEY と getSavedApiKey() は既存のものをそのまま使います。
     重複宣言になるので、このファイルには意図的に含めていません。
============================================================================ */

const MODEL_CACHE_KEY = "tekei_master_gemini_model";
const GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta";

// 新しい順。ここが全部廃止されても下の自動探索で復旧するので、原則メンテ不要。
const CANDIDATE_MODELS = [
    "gemini-3.5-flash-lite", // 既定の思考=ミニマル。速い・安い。この用途に最適
    "gemini-3.6-flash",
    "gemini-3.5-flash",
    "gemini-2.5-flash"
];

// CORS で x-goog-api-key が弾かれる環境なら false にすると ?key= 方式に戻ります
const USE_HEADER_AUTH = true;

function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

function buildGeminiRequest(model, apiKey, payload) {
    const headers = { "Content-Type": "application/json" };
    let url = `${GEMINI_API_BASE}/models/${model}:generateContent`;
    if (USE_HEADER_AUTH) headers["x-goog-api-key"] = apiKey;
    else url += `?key=${encodeURIComponent(apiKey)}`;
    return { url, init: { method: "POST", headers, body: JSON.stringify(payload) } };
}

/** 実際に使えるモデルを API に問い合わせて 1 つ選ぶ。見つからなければ null */
async function discoverUsableModel(apiKey) {
    let url = `${GEMINI_API_BASE}/models`;
    const headers = {};
    if (USE_HEADER_AUTH) headers["x-goog-api-key"] = apiKey;
    else url += `?key=${encodeURIComponent(apiKey)}`;

    let data;
    try {
        const res = await fetch(url, { headers });
        data = await res.json();
        if (!res.ok) return null;
    } catch (e) { return null; }

    const models = Array.isArray(data && data.models) ? data.models : [];
    const NG = /image|tts|audio|embedding|veo|lyria|live|robotics|imagen|gemma|deep-research|antigravity|omni/i;

    const usable = models
        .map(m => String(m.name || "").replace(/^models\//, ""))
        .filter((name, i) => {
            const methods = models[i].supportedGenerationMethods;
            const okMethod = !Array.isArray(methods) || methods.includes("generateContent");
            return name && okMethod && !NG.test(name) && /gemini/i.test(name);
        });

    if (!usable.length) return null;

    const score = n => {
        let s = 0;
        if (/flash-lite/.test(n)) s += 200;
        else if (/flash/.test(n)) s += 100;
        if (/preview|exp/.test(n)) s -= 50;
        const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || "0");
        return s + v;
    };
    usable.sort((a, b) => score(b) - score(a));
    return usable[0];
}

async function tryGeminiModel(model, apiKey, payload) {
    const { url, init } = buildGeminiRequest(model, apiKey, payload);
    let res, data;
    try {
        res = await fetch(url, init);
    } catch (e) {
        return { ok: false, message: `通信に失敗しました（${model}）。ネットワークまたは CORS をご確認ください。` };
    }
    try { data = await res.json(); } catch (e) { data = {}; }

    if (!res.ok) {
        const msg = (data.error && data.error.message) || `HTTP ${res.status}`;
        if (res.status === 404) return { ok: false, notFound: true, message: `モデル ${model} は利用できません（${msg}）` };
        if (res.status === 403) return {
            ok: false, fatal: true,
            message: `❌ APIキーが拒否されました（403）。\nGoogle AI Studio / Cloud Console でキーの制限設定を開き、公開先のドメインを許可リストに追加してください。\n詳細: ${msg}`
        };
        if (res.status === 429) return { ok: false, fatal: true, message: "❌ 利用上限に達しました（429）。しばらく待ってからお試しください。" };
        return { ok: false, message: `${msg}（${model}）` };
    }

    const cand = (data.candidates && data.candidates[0]) || null;
    const parts = (cand && cand.content && cand.content.parts) || [];
    const text = parts.map(p => p.text || "").join("").trim();
    if (text) return { ok: true, text };

    const finish = cand && cand.finishReason;
    if (finish === "MAX_TOKENS") return { ok: false, fatal: true, message: "❌ 出力の上限に達しました。maxOutputTokens を増やしてください。" };
    if (finish === "SAFETY" || (data.promptFeedback && data.promptFeedback.blockReason)) {
        return { ok: false, fatal: true, message: "❌ 安全性フィルタにより回答が返りませんでした。文を変えてお試しください。" };
    }
    return { ok: false, message: `空の応答が返りました（${model} / finishReason: ${finish || "不明"}）` };
}

/** 戻り値は常に文字列。キー未設定のときだけ null（＝ローカルモードに落ちる） */
async function callGeminiAPI(userPrompt, systemPrompt = "") {
    const apiKey = getSavedApiKey();
    if (!apiKey) return null;

    const payload = {
        contents: [{ role: "user", parts: [{ text: userPrompt }] }],
        // 思考モデルでは思考トークンも上限を消費するため、300 では本文が出ない
        generationConfig: { maxOutputTokens: 1024 }
    };
    if (systemPrompt) payload.systemInstruction = { parts: [{ text: systemPrompt }] };

    const cached = lsGet(MODEL_CACHE_KEY);
    const tryList = [];
    if (cached) tryList.push(cached);
    for (const m of CANDIDATE_MODELS) if (m !== cached) tryList.push(m);

    let lastError = "";
    let sawNotFound = false;

    for (const model of tryList) {
        const r = await tryGeminiModel(model, apiKey, payload);
        if (r.ok) { lsSet(MODEL_CACHE_KEY, model); return r.text; }
        if (r.fatal) return r.message;
        if (r.notFound) { sawNotFound = true; if (cached === model) lsDel(MODEL_CACHE_KEY); }
        lastError = r.message || lastError;
    }

    if (sawNotFound) {
        const found = await discoverUsableModel(apiKey);
        if (found) {
            const r = await tryGeminiModel(found, apiKey, payload);
            if (r.ok) { lsSet(MODEL_CACHE_KEY, found); return r.text; }
            lastError = r.message || lastError;
        }
    }

    return `❌ AIに接続できませんでした。\n${lastError || "ネットワークまたはAPIキーをご確認ください。"}`;
}

/* ---------------------------------------------------------------------------
   接続テスト（任意）
   APIキー設定モーダルの「保存する」ボタンの直後に、次の 1 行を足すと使えます:

   <button onclick="runGeminiSelfTest()" class="py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-sm rounded-xl transition">接続テスト</button>
--------------------------------------------------------------------------- */
async function runGeminiSelfTest() {
    const key = getSavedApiKey();
    if (!key) { alert("⚪️ APIキーが未設定です。"); return; }
    const t0 = Date.now();
    const r = await callGeminiAPI("「テスト」とだけ返してください。", "");
    const ms = Date.now() - t0;
    if (r && !r.startsWith("❌")) {
        alert(`🟢 接続OK（${ms}ms）\n使用モデル: ${lsGet(MODEL_CACHE_KEY) || "不明"}\n応答: ${r.slice(0, 40)}`);
    } else {
        alert(r || "❌ 不明なエラー");
    }
}
